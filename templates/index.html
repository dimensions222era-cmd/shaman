<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHAMAN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial}
header{padding:20px 5%;display:flex;justify-content:space-between;border-bottom:1px solid #292929}
.logo{font-size:27px;font-weight:900;letter-spacing:4px}
a{color:#aaa;text-decoration:none;margin-left:12px}
.hero{padding:45px 5%}
.hero h1{font-size:55px;margin:0}
.hero p{color:#888}
.admin{margin:0 5% 25px;padding:20px;background:#191919;border:1px solid #333;border-radius:12px}
input,button{padding:12px;margin-top:10px;border-radius:7px;border:0}
button{background:white;color:black;font-weight:bold}
.grid{columns:2 150px;column-gap:15px;padding:0 5%}
.card{break-inside:avoid;margin-bottom:15px;background:#171717;border-radius:12px;overflow:hidden}
.card img{width:100%;display:block}
.card p{padding:12px;color:#ddd}
footer{text-align:center;padding:30px;color:#666}
</style>
</head>
<body>

<header>
<div class="logo">SHAMAN.</div>
<nav>
<a href="/">Главная</a>
{% if admin %}
<a href="#admin">Админ-панель</a>
<a href="/logout">Выйти</a>
{% else %}
<a href="/login">Войти</a>
{% endif %}
</nav>
</header>

<section class="hero">
<h1>ЧЕЛ, ИДИ<br>НАХУЙ.</h1>
<p>Твоя территория мемов.</p>
</section>

{% if admin %}
<div class="admin" id="admin">
<h2>⚙️ Админ-панель</h2>
<form action="/upload" method="POST" enctype="multipart/form-data">
<input type="file" name="file" accept="image/*" required>
<br>
<input type="text" name="caption" placeholder="Подпись к мему">
<br>
<button type="submit">➕ Опубликовать</button>
</form>
</div>
{% endif %}

<section class="grid">
{% for file in media %}
<div class="card">
<img src="{{ url_for('static', filename='uploads/' + file) }}">
</div>
{% endfor %}
</section>

<footer>SHAMAN © 2026</footer>
</body>
</html>
