<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — SHAMAN MUSIC</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial;display:grid;place-items:center;min-height:100vh;padding:20px}
.box{width:100%;max-width:380px;background:#151515;padding:30px;border-radius:18px}
h1{letter-spacing:3px}
p{color:#888}
input,button{width:100%;padding:14px;margin-top:13px;border-radius:9px}
input{background:#090909;color:white;border:1px solid #333}
button{background:white;color:black;border:0;font-weight:bold}
a{color:#aaa}
</style>
</head>
<body>
<div class="box">
<h1>SHAMAN MUSIC</h1>
<p>Рады снова видеть тебя</p>
<form method="post">
<input name="username" placeholder="Логин" required>
<input name="password" type="password" placeholder="Пароль" required>
<button type="submit">ВОЙТИ</button>
</form>

<div style="text-align:center;margin:20px 0;color:#777">ИЛИ</div>
<a href="/login/google" style="display:block;text-align:center;background:#fff;color:#111;padding:14px;border-radius:9px;text-decoration:none;font-weight:bold">
    🌐 ВОЙТИ ЧЕРЕЗ GOOGLE
</a>
<p>Нет аккаунта? <a href="/register">Регистрация</a></p>
</div>
</body>
</html>
