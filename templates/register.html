<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация — SHAMAN MUSIC</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial;display:grid;place-items:center;min-height:100vh;padding:20px}
.box{width:100%;max-width:380px;background:#151515;padding:30px;border-radius:18px}
h1{letter-spacing:3px}
p{color:#888}
input,button{width:100%;padding:14px;margin-top:13px;border-radius:9px}
input{background:#090909;color:white;border:1px solid #333}
button{background:white;color:black;border:0;font-weight:bold}
a{color:#aaa}
</style>
</head>
<body>
<div class="box">
<h1>SHAMAN MUSIC</h1>
<p>Создай свой аккаунт</p>
<form method="post">
<input name="username" placeholder="Логин" minlength="3" maxlength="30" required>
<input name="email" type="email" placeholder="Электронная почта" required>
<input name="password" type="password" placeholder="Пароль (минимум 8 символов)" minlength="8" required>
<button type="submit">ЗАРЕГИСТРИРОВАТЬСЯ</button>
</form>
<p>Уже есть аккаунт? <a href="/login">Войти</a></p>
</div>
</body>
</html>
