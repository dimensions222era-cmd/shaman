<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Налаштування — SHAMAN MUSIC</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:#fff;font-family:Arial,sans-serif;padding:25px}
.container{max-width:600px;margin:40px auto;background:#1b1b28;padding:28px;border-radius:18px}
h1{margin-top:0}
.setting{margin:25px 0}
label{display:block;margin-bottom:12px;color:#bbb}
select{width:100%;padding:14px;border-radius:10px;background:#29293a;color:white;border:1px solid #444;font-size:16px}
button,a{display:inline-block;padding:12px 18px;border:0;border-radius:10px;background:#7655e8;color:white;text-decoration:none;font-size:15px;cursor:pointer}

/* CHRISTMAS SETTINGS */
.container{
    border:1px solid rgba(255,215,120,.3);
    box-shadow:0 0 25px rgba(220,30,45,.15);
}
h1{
    color:#f5d58a;
    text-shadow:0 0 12px rgba(255,215,120,.3);
}
button,a{
    background:linear-gradient(135deg,#b51f32,#167a43);
}
#snow-container{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:5;
}
.snowflake{
    position:fixed;
    top:-20px;
    z-index:5;
    color:white;
    pointer-events:none;
    user-select:none;
    animation:snowfall linear infinite;
}
@keyframes snowfall{
    to{transform:translateY(110vh) rotate(360deg)}
}

</style>
</head>
<body>
<div class="container">
<h1 id="heading">⚙️ Налаштування</h1>
<div class="setting">
<label id="languageLabel" for="language">Мова сайту</label>
<select id="language">
<option value="uk">🇺🇦 Українська</option>
<option value="en">🇬🇧 English</option>
</select>
</div>
<div class="setting">
<label id="themeLabel" for="theme">Тема сайту</label>
<select id="theme">
<option value="dark">🌙 Темна</option>
<option value="light">☀️ Світла</option>
</select>
</div>
<a href="/" id="back">← На головну</a>
</div>
<script>
const language = document.getElementById('language');
const theme = document.getElementById('theme');

const translations = {
uk: {
heading:'⚙️ Налаштування',
language:'Мова сайту',
theme:'Тема сайту',
dark:'🌙 Темна',
light:'☀️ Світла',
back:'← На головну'
},
en: {
heading:'⚙️ Settings',
language:'Website language',
theme:'Website theme',
dark:'🌙 Dark',
light:'☀️ Light',
back:'← Home'
}
};

function setLanguage(value) {
const t = translations[value] || translations.uk;
localStorage.setItem('shaman-language', value);
document.documentElement.lang = value;
document.getElementById('heading').textContent = t.heading;
document.getElementById('languageLabel').textContent = t.language;
document.getElementById('themeLabel').textContent = t.theme;
document.getElementById('back').textContent = t.back;
theme.options[0].textContent = t.dark;
theme.options[1].textContent = t.light;
language.value = value;
}

function setTheme(value) {
localStorage.setItem('shaman-theme', value);
document.body.style.background = value === 'light' ? '#f1f1f7' : '#101018';
document.body.style.color = value === 'light' ? '#171725' : '#fff';
document.querySelector('.container').style.background = value === 'light' ? '#fff' : '#1b1b28';
}

language.addEventListener('change', () => setLanguage(language.value));
theme.addEventListener('change', () => setTheme(theme.value));

setLanguage(localStorage.getItem('shaman-language') || 'uk');
theme.value = localStorage.getItem('shaman-theme') || 'dark';
setTheme(theme.value);
</script>
<script>

// CHRISTMAS SNOW
if (!document.getElementById('snow-container')) {
    const snow = document.createElement('div');
    snow.id = 'snow-container';
    snow.style.pointerEvents = 'none';
    for (let i=0; i<30; i++) {
        const f = document.createElement('span');
        f.className = 'snowflake';
        f.textContent = '❄';
        f.style.left = Math.random()*100+'vw';
        f.style.fontSize = (8+Math.random()*13)+'px';
        f.style.opacity = 0.3+Math.random()*0.7;
        f.style.animationDuration = (7+Math.random()*12)+'s';
        f.style.animationDelay = (-Math.random()*15)+'s';
        snow.appendChild(f);
    }
    document.body.appendChild(snow);
}

</script>
</body>
</html>
